events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hides Nginx version on error pages
    server_tokens off;

    server {
    listen 4200;
        server_name localhost;

        # SECURITY: Completely removes the 'Server' header banner
        # (This directive requires the OpenResty image)
        more_clear_headers Server;

        location / {
            # Use the OpenResty default path
            root /usr/local/openresty/nginx/html;
            index index.html index.htm;
            
            # CRITICAL: Fixes Angular routing 404s on page refresh
            try_files $uri $uri/ /index.html;
        }

        # Optional: Add security headers for 2026
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }
}
