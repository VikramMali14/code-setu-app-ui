<mat-toolbar color="primary">
    <a mat-button routerLink="/">
        <h1>
            <img src="assets/images/logo-with-name.png" alt="Cargo-Setu Logo" class="navbar-logo" />
        </h1>
    </a>


    <a mat-button routerLink="/">Home</a>

    <a mat-button routerLink="/dashboard">Dashboard</a>
    <!-- <a mat-button routerLink="/services" class="nav-link">Services</a> -->
    <a mat-button routerLink="/services" #servicesTrigger="matMenuTrigger" [matMenuTriggerFor]="servicesMenu"
        (mouseenter)="servicesTrigger.openMenu()">
        Services
    </a>
    <mat-menu #servicesMenu="matMenu" [overlapTrigger]="false">
        <div (mouseleave)="servicesTrigger.closeMenu()">
            <button mat-menu-item routerLink="/services/shipping">Shipping</button>
            <button mat-menu-item routerLink="/services/tracking">Tracking</button>
            <button mat-menu-item routerLink="/services/shipping">Shipping</button>
            <button mat-menu-item routerLink="/services/tracking">Tracking</button>
        </div>
    </mat-menu>
    <a mat-button routerLink="/about">About</a>
    <a routerLink="/" fragment="contact-section">Contact Us</a>


    <span class="example-spacer"></span>

    <a *ngIf="!loggedIn" mat-button routerLink="/signup">
        <mat-icon>person_add</mat-icon> Sign Up
    </a>
    <a *ngIf="!loggedIn" mat-button routerLink="/login">
        <mat-icon>login</mat-icon> Login
    </a>

    <!-- Added icons for User and Logout -->
    <a *ngIf="loggedIn" mat-button>
        <mat-icon aria-hidden="false">person</mat-icon> User
    </a>

    <a *ngIf="loggedIn" mat-button (click)="logoutUser()" routerLink="/login">
        <mat-icon aria-hidden="false">logout</mat-icon> Logout
    </a>

</mat-toolbar>
