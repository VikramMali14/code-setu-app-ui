<div class="pagination-container flex items-center justify-between p-4 bg-white border-t border-gray-200" *ngIf="totalPages > 0">
  
  <!-- Left Side: Summary -->
  <div class="text-sm text-gray-600">
    Page <b>{{ currentPage + 1 }}</b> of <b>{{ totalPages }}</b>
    <span class="mx-2">|</span>
    <b>{{ pageRecords }}</b> of <b>{{ totalRecords }}</b> records
  </div>

  <!-- Right Side: Controls -->
  <div class="flex items-center space-x-2">
    
    <!-- Previous Button -->
    <button 
      type="button"
      [disabled]="currentPage === 0" 
      (click)="goToPage(currentPage - 1)"
      class="px-2 py-1 border rounded hover:bg-gray-50 disabled:opacity-50 transition-colors">
      &laquo;
    </button>

    <!-- Page Numbers -->
    <div class="flex space-x-1">
      <button 
        type="button"
        *ngFor="let page of visiblePageNumbers"
        (click)="goToPage(page - 1)"
        [ngClass]="(page - 1) === currentPage ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'"
        class="px-3 py-1 border rounded text-sm font-medium transition-all">
        {{ page }}
      </button>
    </div>

    <!-- Next Button -->
    <button 
      type="button"
      [disabled]="currentPage >= totalPages - 1" 
      (click)="goToPage(currentPage + 1)"
      class="px-2 py-1 border rounded hover:bg-gray-50 disabled:opacity-50 transition-colors">
      &raquo;
    </button>

    <!-- Page Size Dropdown -->
    <select 
      class="ml-4 p-1.5 border rounded text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" 
      [ngModel]="pageSize" 
      (ngModelChange)="onSizeChange($event)">
      <option [value]="5">5</option>
      <option [value]="10">10</option>
      <option [value]="25">25</option>
      <option [value]="50">50</option>
    </select>
  </div>
</div>
