<div class="login-page">
    <mat-card class="login-card">

        <!-- HEADER -->
        <div class="login-header">
            <img src="assets/images/LOGO2.png" />
            <p>Create Staff Account</p>
        </div>

        <form [formGroup]="staffForm" (ngSubmit)="submit()" class="form">

            <!-- BASIC INFO -->
            <mat-form-field appearance="outline" class="full">
                <mat-label>Username</mat-label>
                <input matInput formControlName="userName">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>First Name</mat-label>
                <input matInput formControlName="firstName">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Last Name</mat-label>
                <input matInput formControlName="lastName">
            </mat-form-field>

            <!-- LOGIN INFO -->
            <mat-form-field appearance="outline" class="full">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Password</mat-label>
                <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
                <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>

            <!-- CONTACT -->
            <mat-form-field appearance="outline" class="full">
                <mat-label>Mobile Code</mat-label>
                <input matInput formControlName="mobileCode">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Mobile Number</mat-label>
                <input matInput formControlName="mobileNumber">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Country</mat-label>
                <input matInput formControlName="country">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>State</mat-label>
                <input matInput formControlName="state">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>City</mat-label>
                <input matInput formControlName="city">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Address</mat-label>
                <input matInput formControlName="address">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Pincode</mat-label>
                <input matInput formControlName="pincode">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full">
                <mat-label>Department</mat-label>
                <input matInput formControlName="departmentId">
            </mat-form-field>

            <!-- STAFF DETAILS -->
            <mat-form-field appearance="outline" class="full">
                <mat-label>Staff Type</mat-label>
                <mat-select formControlName="staffType">
                    <mat-option value="ADMIN">Admin</mat-option>
                    <mat-option value="STAFF">Staff</mat-option>
                    <mat-option value="DRIVER">Driver</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-slide-toggle formControlName="isActive">
                Active
            </mat-slide-toggle>

            <!-- SUBMIT -->
            <button mat-raised-button color="primary" class="btn full" type="submit">
                Create Staff
            </button>

        </form>

    </mat-card>
</div>
