<div class="login-page">
  <mat-card class="login-card">

    <div class="login-header">
      <img src="assets/images/LOGO2.png" />
      <p>Create Staff Account</p>
    </div>

    <mat-horizontal-stepper linear>

      <!-- STEP 1 -->
     <mat-step [stepControl]="basicInfoForm">
    <form [formGroup]="basicInfoForm">
          <h3>Basic Information</h3>

          <mat-form-field class="full">
            <mat-label>Username</mat-label>
            <input matInput formControlName="userName">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>First Name</mat-label>
            <input matInput formControlName="firstName">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Last Name</mat-label>
            <input matInput formControlName="lastName">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email">
          </mat-form-field>

          <button mat-raised-button color="primary" matStepperNext>
            Next
          </button>
        </form>
      </mat-step>

      <!-- STEP 2 -->
      <mat-step [stepControl]="addressInfoForm">
    <form [formGroup]="addressInfoForm">
          <h3>Address Details</h3>

          <mat-form-field class="full">
            <mat-label>Country</mat-label>
            <input matInput formControlName="country">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>State</mat-label>
            <input matInput formControlName="state">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>City</mat-label>
            <input matInput formControlName="city">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Address</mat-label>
            <input matInput formControlName="address">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Pincode</mat-label>
            <input matInput formControlName="pincode">
          </mat-form-field>

          <button mat-button matStepperPrevious>Back</button>
          <button mat-raised-button color="primary" matStepperNext>
            Next
          </button>
        </form>
      </mat-step>

      <!-- STEP 3 -->
      <mat-step [stepControl]="otherInfoForm">
    <form [formGroup]="otherInfoForm">
          <h3>Other Details</h3>

          <mat-form-field class="full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'"
                   formControlName="password">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Mobile Number</mat-label>
            <input matInput type="number" formControlName="mobileNumber">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Department</mat-label>
            <input matInput type="number" formControlName="departmentId">
          </mat-form-field>

          <mat-form-field class="full">
            <mat-label>Staff Type</mat-label>
            <mat-select formControlName="staffType">
              <mat-option value="ADMIN">Admin</mat-option>
              <mat-option value="STAFF">Staff</mat-option>
              <mat-option value="DRIVER">Driver</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-slide-toggle formControlName="isActive">
            Active
          </mat-slide-toggle>

          <button mat-button matStepperPrevious>Back</button>
          <button mat-raised-button color="primary"
                  (click)="submit()" [disabled]="submitting">
            Create Staff
          </button>
        </form>
      </mat-step>

    </mat-horizontal-stepper>
  </mat-card>
</div>
