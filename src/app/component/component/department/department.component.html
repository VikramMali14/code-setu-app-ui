<div class="doc-page">

  <!-- PAGE TITLE -->
  <div class="doc-header">
    <h1>Department Management</h1>
    <p>
      This section allows administrators to view, edit, and manage departments.
    </p>
  </div>

  <!-- ACTION BAR -->
  <div class="doc-actions">
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Add Department
    </button>
  </div>

  <!-- DEPARTMENT LIST SECTION -->
  <mat-card class="doc-card">

    <mat-card-title>Department List</mat-card-title>
    <mat-card-subtitle>
      List of all configured departments with current status.
    </mat-card-subtitle>

    <table mat-table [dataSource]="departments" class="mat-elevation-z2">

      <!-- NAME -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let d">{{ d.name }}</td>
      </ng-container>

      <!-- DESCRIPTION -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let d">{{ d.description }}</td>
      </ng-container>

      <!-- STATUS -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let d">
          <span class="status-badge active" *ngIf="d.isActive">Active</span>
          <span class="status-badge inactive" *ngIf="!d.isActive">Inactive</span>
        </td>
      </ng-container>

      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
          <button mat-icon-button color="primary" (click)="openEdit(d)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(d.id!)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </mat-card>

</div>
