<div class="doc-grid">

  <!-- LEFT : TABLE -->
  <mat-card>
    <mat-card-title>Departments</mat-card-title>

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let d">{{ d.name }}</td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let d">{{ d.code }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let d">
          <span [class.active]="d.isActive" [class.inactive]="!d.isActive">
            {{ d.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
          <button mat-icon-button (click)="openEdit(d)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteDepartment(d.id!)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>

  <!-- RIGHT : FORM -->
  <mat-card>
    <mat-card-title>
      {{ isEditMode ? 'Edit Department' : 'Create Department' }}
    </mat-card-title>

    <form [formGroup]="departmentForm" (ngSubmit)="submit()">

      <mat-form-field class="full">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
      </mat-form-field>

      <mat-form-field class="full">
        <mat-label>Department Code</mat-label>
        <input matInput formControlName="code">
      </mat-form-field>

      <mat-form-field class="full">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>

      <mat-slide-toggle formControlName="isActive">
        Active
      </mat-slide-toggle>

      <div class="form-actions">
        <button mat-raised-button color="primary" type="submit">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
        <button mat-button type="button" (click)="reset()">Clear</button>
      </div>

    </form>
  </mat-card>

</div>
