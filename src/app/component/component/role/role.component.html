<form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="example-form">


    <!-- Role Name -->
    <mat-form-field class="example-full-width" appearance="outline">
        <mat-label>Role Name</mat-label>
        <input matInput formControlName="roleName" placeholder="e.g. Administrator">

        <mat-hint>Display name for the role</mat-hint>

        <mat-error *ngIf="roleForm.get('roleName')?.hasError('required')">
            Role name is <strong>required</strong>
        </mat-error>
    </mat-form-field>
    <!-- Role Code -->
    <mat-form-field class="example-full-width" appearance="outline">
        <mat-label>Role Code</mat-label>
        <input matInput formControlName="code" placeholder="e.g. ADMIN_01">

        <mat-hint>Unique role identifier</mat-hint>

        <mat-error *ngIf="roleForm.get('code')?.hasError('required')">
            Role code is <strong>required</strong>
        </mat-error>
    </mat-form-field>


    <!-- Description -->
    <mat-form-field class="example-full-width" appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="discription" rows="3" placeholder="Describe the role"></textarea>

        <mat-hint>Optional</mat-hint>
    </mat-form-field>

    <!-- Scope -->
    <mat-form-field class="example-full-width" appearance="outline">
        <mat-label>Scope</mat-label>
        <input matInput formControlName="scope" placeholder="GLOBAL / PROJECT / USER">

        <mat-hint>Defines role access scope</mat-hint>

        <mat-error *ngIf="roleForm.get('scope')?.hasError('required')">
            Scope is <strong>required</strong>
        </mat-error>
    </mat-form-field>

    <!-- Permissions -->
    <div formGroupName="permissions" class="permissions-box">
        <h3>Permissions</h3>
        <p class="hint-text">Assign permissions to this role</p>
        <!-- add permission checkboxes later -->
    </div>

    <!-- Submit -->
    <button mat-raised-button color="primary" type="submit" [disabled]="roleForm.invalid">
        Save Role
    </button>

</form>
