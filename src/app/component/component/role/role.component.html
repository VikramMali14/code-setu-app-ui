<div class="col-md-6 offset-md-3">
    <h3>Create Role</h3>

    <form [formGroup]="roleForm" (ngSubmit)="onSubmit()">

        <!-- Role Name -->
        <div class="form-group mb-3">
            <label for="roleName">Role Name</label>
            <input type="text" id="roleName" class="form-control" formControlName="roleName"
                placeholder="e.g. Administrator">

            <small class="text-muted">Display name for the role</small>

            <div class="text-danger"
                *ngIf="roleForm.get('roleName')?.touched && roleForm.get('roleName')?.hasError('required')">
                Role name is required
            </div>
        </div>

        <!-- Role Code -->
        <div class="form-group mb-3">
            <label for="code">Role Code</label>
            <input type="text" id="code" class="form-control" formControlName="code" placeholder="e.g. ADMIN_01">

            <small class="text-muted">Unique role identifier</small>

            <div class="text-danger"
                *ngIf="roleForm.get('code')?.touched && roleForm.get('code')?.hasError('required')">
                Role code is required
            </div>
        </div>

        <!-- Description -->
        <div class="form-group mb-3">
            <label for="description">Description</label>
            <textarea id="description" class="form-control" rows="3" formControlName="discription"
                placeholder="Describe the role"></textarea>

            <small class="text-muted">Optional</small>
        </div>

        <!-- Scope -->
        <div class="form-group mb-3">
            <label for="scope">Scope</label>
            <input type="text" id="scope" class="form-control" formControlName="scope"
                placeholder="GLOBAL / PROJECT / USER">

            <small class="text-muted">Defines role access scope</small>

            <div class="text-danger"
                *ngIf="roleForm.get('scope')?.touched && roleForm.get('scope')?.hasError('required')">
                Scope is required
            </div>
        </div>

        <!-- Permissions -->
        <div formGroupName="permissions" class="mb-3">
            <label class="form-label fw-semibold">Permissions</label>

            <div class="dropdown w-100">
                <button class="btn btn-secondary dropdown-toggle w-100 text-start" type="button"
                    data-bs-toggle="dropdown">
                    Select Permissions
                </button>

                <div class="dropdown-menu w-100 p-3 permissions-dropdown" (click)="$event.stopPropagation()">

                    <div *ngFor="let perm of permissionsList" class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" [formControlName]="perm.key" [id]="perm.key">
                        <label class="form-check-label" [for]="perm.key">
                            {{ perm.label }}
                        </label>
                    </div>

                </div>
            </div>
        </div>




        <!-- Submit -->
        <button type="submit" class="btn btn-primary mt-2" [disabled]="roleForm.invalid">
            Save Role
        </button>

    </form>
</div>
