<section class="vehicle-map-page">
  <header class="vehicle-map-header">
    <div>
      <h1>Vehicle Tracking</h1>
      <p>Live location for vehicle #{{ vehicleId }}</p>
    </div>
  </header>

  <google-map
    *ngIf="mapsLoaded; else mapsUnavailable"
    height="100%"
    width="100%"
    [center]="center"
    [zoom]="15">
    <map-marker
      [position]="markerPosition"
      [icon]="vehicleIcon">
    </map-marker>

    <map-polyline
      *ngIf="path.length > 1"
      [path]="path"
      [options]="polylineOptions">
    </map-polyline>
  </google-map>

  <ng-template #mapsUnavailable>
    <div class="map-unavailable">
      <mat-icon>map</mat-icon>
      <h2>Map unavailable</h2>
      <p>{{ mapsLoadError || 'Loading Google Maps...' }}</p>
    </div>
  </ng-template>
</section>
