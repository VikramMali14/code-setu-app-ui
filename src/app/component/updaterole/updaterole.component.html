<div class="col-md-6 offset-md-3 ">
  <h3>Update Role</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" class="form-control" id="firstName"  name="roleName" required>
    </div>
    <div class="form-group">
      <label for="lastName">Code name</label>
      <input type="text" class="form-control" id="lastName"  name="codename" required>
    </div>
    <div class="form-group">
      <label for="discription">Discription</label>
      <input type="text" class="form-control" id="emailId"  name="discription" required>
    </div>
    <div class="form-group">
      <label for="scope">Scope</label>
      <input type="text" class="form-control" id="age" name="scope" required>
    </div>

    <button type="submit" class="btn btn-primary mt-2">Submit</button>
  </form>
</div>
