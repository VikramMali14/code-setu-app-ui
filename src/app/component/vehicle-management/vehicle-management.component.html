<section class="vehicle-management-page">
  <header class="vehicle-management-header">
    <div>
      <h1>Vehicle Management</h1>
      <p>Choose a module to manage vehicles, drivers, or assignments.</p>
    </div>
  </header>

  <div class="dashboard-card-grid">
    <article class="dashboard-card" *ngFor="let card of cards">
      <div class="dashboard-card-icon">
        <mat-icon>{{ card.icon }}</mat-icon>
      </div>

      <div>
        <h2>{{ card.title }}</h2>
        <p>{{ card.description }}</p>
      </div>

      <a class="primary-action" [routerLink]="card.route">Open</a>
    </article>
  </div>
</section>
