<section class="vehicle-management-page">
  <header class="vehicle-management-header">
    <div>
      <p class="eyebrow">Vehicle Management</p>
      <h1>Logistics Control</h1>
    </div>
  </header>

  <section class="module-section">
    <div class="section-title">
      <mat-icon>apps</mat-icon>
      <h2>Modules</h2>
    </div>

    <div class="module-grid">
      <a
        class="module-card"
        [ngClass]="'accent-' + card.accent"
        *ngFor="let card of cards"
        [routerLink]="card.route">
        <span class="icon-wrapper">
          <mat-icon>{{ card.icon }}</mat-icon>
        </span>
        <span class="card-title">{{ card.title }}</span>
        <span class="card-subtitle">{{ card.description }}</span>
        <span class="open-link">Open</span>
      </a>
    </div>
  </section>
</section>
