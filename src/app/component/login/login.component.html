<app-loader [isLoading]="isLoading"></app-loader>

<div class="login-page">
  <mat-card class="login-card" [@cardAnim]>

    <!-- HEADER -->
    <div class="login-header">
              <img src="assets/images/logo-with-name.png" alt="Cargo-Setu Logo" class="login-logo" />
      <p>Transport Business, Ab Digital!!</p>
    </div>

    <mat-tab-group mat-stretch-tabs (selectedTabChange)="onTabChange()">

      <!-- EMAIL LOGIN -->
      <mat-tab label="Email">
        <form #loginForm="ngForm" (ngSubmit)="loginWithEmail()" class="form">

          <mat-form-field appearance="outline" class="full">
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="credential.email" name="email" required>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="credential.password"
              name="password" required>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <button mat-raised-button color="primary" class="btn" [disabled]="loginForm.invalid">Login</button>
        </form>
        <!-- <a href=""></a> -->
        <button class="mat-mdc-stroked-button google-btn">
          <span class="mdc-button__label">
             <a href="/signup">Don't have an account?</a>
          </span>
        </button>
      </mat-tab>

      <!-- OTP LOGIN -->
      <mat-tab label="OTP">

        <!-- STEP 1: MOBILE -->
        <form *ngIf="!otpSent" (ngSubmit)="sendOtp()" class="form">

          <div class="mobile-field-container">
            <mat-form-field appearance="outline" class="mobile-code-field">
              <mat-label>Code</mat-label>
              <mat-select [(ngModel)]="otp.mobileCode" name="mobileCode">
                <mat-option *ngFor="let c of countryCodes" [value]="c.code">
                  {{c.cca2 ? c.cca2 + ' (' + c.code + ')' : c.code + ' (' + c.name + ')'}}
                </mat-option>
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="mobile-number-field">
              <mat-label>Mobile Number</mat-label>
              <input matInput type="tel" [(ngModel)]="otp.mobile" name="mobile" required>
            </mat-form-field>
          </div>

          <button mat-raised-button color="primary" class="btn">
            Send OTP
          </button>
        </form>

        <!-- STEP 2: OTP VERIFY -->
        <form *ngIf="otpSent" (ngSubmit)="verifyOtp()" class="form fade-in">

          <mat-form-field appearance="outline" class="full">
            <mat-label>Enter OTP</mat-label>
            <input matInput maxlength="6" [(ngModel)]="otp.code" name="otp" required>
          </mat-form-field>

          <button mat-raised-button color="primary" class="btn">
            Verify & Login
          </button>

          <a class="resend" (click)="sendOtp()">Resend OTP</a>

        </form>
        <!-- BELOW LOGIN BUTTON -->
        <div class="divider">
          <span>OR</span>
        </div>

        <div class="google-btn-wrapper">
          <button type="button" mat-raised-button color="primary" class="btn google-visual-btn">
            <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.68 9c0-.593.102-1.17.284-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
            </svg>
            Continue with Google
          </button>
          <div id="googleSignInDiv" class="google-real-btn"></div>
        </div>

      </mat-tab>

    </mat-tab-group>
  </mat-card>
</div>
