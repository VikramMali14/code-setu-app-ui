<ng-container *ngIf="!isInternalApp; else internalShell">
  <app-nav-bar></app-nav-bar>

  <button mat-fab class="scroll-to-top" [class.show]="showScrollButton" (click)="scrollToTop()"
    aria-label="Scroll to top">
    <mat-icon>arrow_upward</mat-icon>
  </button>

  <div class="page-wrapper">
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
</ng-container>

<ng-template #internalShell>
  <div class="admin-shell">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" [class.show]="!isSidebarCollapsed && isMobileView" (click)="closeSidebar()">
    </div>

    <aside class="admin-sidebar" [class.collapsed]="isSidebarCollapsed">
      <div class="sidebar-brand">
        <img [src]="companyLogo || 'assets/images/APP_Icon.png'" alt="Logo" class="sidebar-logo">
        <span class="sidebar-brand-name" *ngIf="!isSidebarCollapsed">{{ companyLogo ? (companyName || 'CargoSetu Pvt.') : 'CargoSetu Pvt.' }}</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section" *ngFor="let section of menuSections">
          <ng-container *ngIf="section.id === 'main'; else dropdownSection">
            <button
              type="button"
              *ngFor="let item of section.items"
              [routerLink]="!item.comingSoon && item.route ? item.route : null"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
              (click)="handleMenuClick(item)">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
              <small *ngIf="item.comingSoon">Soon</small>
            </button>
          </ng-container>

          <ng-template #dropdownSection>
            <button
              type="button"
              class="dropdown-trigger"
              [class.open]="isMenuSectionOpen(section)"
              (click)="toggleMenuSection(section)">
              <mat-icon>{{ section.icon }}</mat-icon>
              <span>{{ section.label }}</span>
              <mat-icon class="dropdown-caret">expand_more</mat-icon>
            </button>

            <div class="sub-menu" *ngIf="isMenuSectionOpen(section)">
              <button
                type="button"
                class="sub-menu-item"
                *ngFor="let item of section.items"
                [routerLink]="!item.comingSoon && item.route ? item.route : null"
                routerLinkActive="active"
                (click)="handleMenuClick(item)">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
                <small *ngIf="item.comingSoon">Soon</small>
              </button>
            </div>
          </ng-template>
        </div>
      </nav>
    </aside>

    <main class="admin-main" [class.sidebar-collapsed]="isSidebarCollapsed && !isMobileView">
      <header class="admin-topbar">
        <button type="button" class="icon-button" (click)="toggleSidebar()">
          <mat-icon>{{ isSidebarCollapsed ? 'menu' : 'menu_open' }}</mat-icon>
        </button>
        <div class="admin-search">
          <mat-icon>search</mat-icon>
          <input type="search" placeholder="Search...">
        </div>

        <div class="topbar-actions">
          <button type="button" class="icon-button" aria-label="Notifications">
            <mat-icon>notifications</mat-icon>
          </button>

          <div class="profile-menu-wrap">
            <button type="button" class="profile-button" (click)="toggleProfileMenu()">
              <mat-icon>person</mat-icon>
              <span>{{ username }}</span>
              <mat-icon class="caret" [class.rotate]="showProfileMenu">expand_more</mat-icon>
            </button>

            <div class="profile-menu" *ngIf="showProfileMenu">
              <button type="button" (click)="goToStaffDetails()">
                <mat-icon>badge</mat-icon>
                <span>My Profile</span>
              </button>
              <button type="button" (click)="goToEditProfile()">
                <mat-icon>edit</mat-icon>
                <span>Edit Profile</span>
              </button>
              <app-theme-customizer></app-theme-customizer>
              <button type="button" (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <section class="admin-content">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</ng-template>
